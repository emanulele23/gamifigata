services:
  echo-api:
    build: ./echo-api
    container_name: echo-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_PATH=/app/data/echo.db
      - TMP_AUDIO_DIR=/app/tmp
    ports:
      - "5000:5000"
    volumes:
      - ./echo-api/data:/app/data
      - echo_tmp:/app/tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Opzionale — solo per utenti avanzati
  n8n:
    profiles: ["advanced"]
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: echo-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-0.0.0.0}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - NODE_ENV=production
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Europe/Rome}
      - TZ=${TZ:-Europe/Rome}
    volumes:
      - ./n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    depends_on:
      echo-api:
        condition: service_healthy

volumes:
  echo_tmp:
